name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Read-only token: this workflow never needs to write to the repository, and it has no access to signing secrets.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # AGP 8.7 + Gradle 8.10 require JDK 17 or newer; 17 is the pinned, supported choice.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Android lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify the APK exists and give it a predictable name
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Expected APK was not produced: $APK"
            ls -R app/build/outputs || true
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/Hisn-Browser-debug.apk
          ls -l dist/Hisn-Browser-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hisn-Browser-APK
          path: dist/Hisn-Browser-debug.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hisn-Browser-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
